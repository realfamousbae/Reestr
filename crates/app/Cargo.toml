[package]
name = "reestr-app"
description = "Reestr desktop app: Tauri commands between the UI and core/storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "reestr_app"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
reestr-core.workspace = true
reestr-storage.workspace = true
serde.workspace = true
tauri = { version = "2.12", features = [] }
# Native open/save file dialogs for choosing the .reestr file.
tauri-plugin-dialog = "2.8"
# The user's today for product deadlines (already used by core and storage).
time.workspace = true
zeroize.workspace = true

[dev-dependencies]
# Reads tauri.conf.json in the version test.
serde_json.workspace = true

[lints]
workspace = true
