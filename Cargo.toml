[workspace]
resolver = "3"
members = ["crates/core", "crates/storage", "crates/app"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
reestr-core = { path = "crates/core" }
reestr-storage = { path = "crates/storage" }

calamine = { version = "0.37", default-features = false }
rusqlite = { version = "0.41", default-features = false }
rust_xlsxwriter = { version = "0.101", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"
time = { version = "0.3.41", features = ["formatting", "macros", "parsing", "serde"] }
zeroize = "1.8"

# SQLCipher's C code and key derivation run in every test; keep them fast in debug builds.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Money must never go through floats (PLAN §15).
float_arithmetic = "deny"
cast_precision_loss = "deny"
